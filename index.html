<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #ff4757; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 20px; }
        .buttons button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .buttons button:hover { background: #ff6b81; }
        .credit { font-size: 12px; color: #888; margin-top: 20px; }
        #confetti {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="name">Happy Birthday, Bbe!</h1>
        <p id="message">Wishing you all the best on your special day!</p>
        <div class="buttons">
            <button id="playBtn">Play Music</button>
            <button id="shareBtn">Celebrate!</button>
        </div>
        <p class="credit">Make a wish ✨</p>
    </div>
    <canvas id="confetti"></canvas>
    <audio id="bgmusic" loop></audio>

    <script>
        const playBtn = document.getElementById('playBtn');
        const bgMusic = document.getElementById('bgmusic');
        const shareBtn = document.getElementById('shareBtn');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    playBtn.innerText = "Pause Music";
                }).catch(error => {
                    alert("Tap play to allow audio.");
                });
            } else {
                bgMusic.pause();
                isPlaying = false;
                playBtn.innerText = "Play Music";
            }
        });

        shareBtn.addEventListener('click', () => {
            startConfetti();
            shareBtn.innerText = "Celebrating! 🎉";
            setTimeout(() => {
                shareBtn.innerText = "Celebrate!";
            }, 2000);
        });

        function startConfetti() {
            const canvas = document.getElementById('confetti');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    color: hsl(${Math.random() * 360}, 100%, 50%),
                    tilt: Math.random() * 10 - 10
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p) => {
                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2);ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();
                });
                particles.forEach((p) => {
                    p.y += 3;
                    if (p.y > canvas.height) p.y = -10;
                });
            }

            let interval = setInterval(draw, 20);
            setTimeout(() => clearInterval(interval), 4000);
        }
    </script>
</body>
</html>
