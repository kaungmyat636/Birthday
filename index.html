<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <h1 id="name">Happy Birthday, Friend!</h1>
        <p id="message">Wishing you a day filled with love and joy.</p>
        <div class="buttons">
            <button id="playBtn">Play Music</button>
            <button id="shareBtn">Celebrate!</button>
        </div>
        <p class="credit">Make a wish ✨ — customize via ?name=...&msg=...&music=...</p>
    </div>
    <canvas id="confetti"></canvas>
    <audio id="bgmusic" loop></audio>
    <script src="script.js"></script>
</body>
</html>
